name: DCO

on: pull_request

permissions:
  contents: read

jobs:
  signoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit is signed off
        run: |
          missing=$(git log --no-merges --format='%H %s%n%b%n--END--' origin/${{ github.base_ref }}..HEAD \
            | awk '/^[0-9a-f]{40} /{sha=$1; ok=0} /^Signed-off-by: /{ok=1} /^--END--$/{if(!ok) print sha}')
          if [ -n "$missing" ]; then
            echo "Commits missing a Signed-off-by line (see CONTRIBUTING.md):"; echo "$missing"; exit 1
          fi
